<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">前進Euler法の安定領域と移流差分の曲線</title>
  <desc id="desc">青い円内が前進Euler法の安定領域。緑の円はCFL数0.5の風上差分で全体が領域内。赤い円はCFL数1.2の風上差分で一部が領域外。紫の縦線はCFL数0.5の中心差分で原点以外は領域外。</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="110" y="35" fill="#182a42" font-family="sans-serif" font-size="20" font-weight="700">前進Euler法と移流差分の安定性曲線</text>
  <rect x="100" y="54" width="530" height="466" fill="#fbfcfe" stroke="#d5dee9" stroke-width="1.5"/>
  <circle cx="410" cy="300" r="180" fill="#e2f2ff" stroke="#1769aa" stroke-width="3"/>
  <line x1="112" y1="300" x2="623" y2="300" stroke="#415466" stroke-width="1.5"/>
  <line x1="590" y1="64" x2="590" y2="511" stroke="#415466" stroke-width="1.5"/>
  <path d="M 623 300 l -9 -5 v 10 z" fill="#415466"/>
  <path d="M 590 64 l -5 9 h 10 z" fill="#415466"/>
  <g stroke="#7a8898" stroke-width="1.2" font-family="sans-serif" font-size="15" fill="#3e4d5e">
    <line x1="230" y1="295" x2="230" y2="305"/><line x1="410" y1="295" x2="410" y2="305"/>
    <line x1="585" y1="120" x2="595" y2="120"/><line x1="585" y1="480" x2="595" y2="480"/>
    <text x="220" y="326" stroke="none">−2</text>
    <text x="591" y="326" stroke="none">0</text>
    <text x="603" y="125" stroke="none">1</text><text x="599" y="485" stroke="none">−1</text>
  </g>
  <text x="486" y="345" fill="#415466" font-family="sans-serif" font-size="16">Re(z)</text>
  <text x="540" y="88" fill="#415466" font-family="sans-serif" font-size="16">Im(z)</text>
  <circle cx="500" cy="300" r="90" fill="none" stroke="#15803d" stroke-width="4"/>
  <circle cx="374" cy="300" r="216" fill="none" stroke="#c43c35" stroke-width="4" stroke-dasharray="11 7"/>
  <line x1="590" y1="210" x2="590" y2="390" stroke="#8736b2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="590" cy="300" r="5" fill="#182a42"/>
  <text x="397" y="336" fill="#3e4d5e" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" font-family="sans-serif" font-size="15">−1</text>
  <g font-family="sans-serif" fill="#213349">
    <text x="675" y="104" font-size="18" font-weight="700">見方</text>
    <rect x="676" y="128" width="24" height="18" fill="#e2f2ff" stroke="#1769aa" stroke-width="2"/>
    <text x="712" y="143" font-size="16">Eulerの安定領域</text>
    <line x1="676" y1="187" x2="700" y2="187" stroke="#15803d" stroke-width="4"/>
    <text x="712" y="192" font-size="16">風上 C = 0.5</text>
    <line x1="676" y1="231" x2="700" y2="231" stroke="#c43c35" stroke-width="4" stroke-dasharray="9 5"/>
    <text x="712" y="236" font-size="16">風上 C = 1.2</text>
    <line x1="676" y1="275" x2="700" y2="275" stroke="#8736b2" stroke-width="5"/>
    <text x="712" y="280" font-size="16">中心 C = 0.5</text>
    <text x="675" y="356" font-size="16" font-weight="700">円内・周上</text>
    <text x="675" y="380" font-size="15">波は増幅しない</text>
    <text x="675" y="431" font-size="16" font-weight="700">円の外</text>
    <text x="675" y="455" font-size="15">波は増幅する</text>
  </g>
</svg>
