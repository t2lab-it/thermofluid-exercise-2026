project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - setup/*.qmd
    - lessons/*.qmd
    - assignments/*.qmd
    - guides/*.qmd
    - advanced/*.qmd

engines: ['julia']
lang: ja

website:
  title: "熱流体力学演習 2026"
  site-url: "https://t2lab-it.github.io/thermofluid-exercise-2026/"
  page-navigation: true
  navbar:
    left:
      - text: ガイド
        rel: split-navigation split-navigation-guides
        menu:
          - href: guides/testing.qmd
            text: テスト
          - href: guides/commands.qmd
            text: コマンド
          - href: guides/troubleshooting.qmd
            text: トラブル対応
          - href: guides/glossary.qmd
            text: 用語集
      - text: 発展資料
        rel: split-navigation split-navigation-advanced
        menu:
          - href: advanced/cairomakie.qmd
            text: CairoMakieによる可視化
  sidebar:
    - id: course
      title: "熱流体力学演習 2026"
      style: docked
      collapse-level: 2
      contents:
        - href: index.qmd
          text: "ホーム"
        - section: "受講準備・共通ガイド"
          contents:
            - href: setup/index.qmd
              text: "受講環境の準備"
            - href: setup/julia.qmd
              text: "Julia・VS Code"
            - href: setup/git-github.qmd
              text: "Git・GitHub"
            - href: setup/agents.qmd
              text: "Coding Agent"
            - href: guides/workflow.qmd
              text: "課題ワークフロー"
            - href: guides/testing.qmd
              text: "テストと数値検証"
        - section: "全15回"
          contents:
            - text: "第1回 ガイダンス、アカウント、環境診断"
              href: lessons/F00.qmd
            - text: "第2回 Julia・Git・GitHubの最小操作"
              href: lessons/F01.qmd
            - text: "第3回 配列・関数・ループ、テスト"
              href: lessons/F02.qmd
            - text: "第4回 ベクトル解析、伝熱、差分と添字"
              href: lessons/F03.qmd
            - text: "第5回 一次元線形・非線形移流"
              href: lessons/N01.qmd
            - text: "第6回 一次元拡散・移流拡散"
            - text: "第7回 Git、テスト、Agentic coding、共通化"
            - text: "第8回 二次元移流、配列軸、可視化、メモリ"
            - text: "第9回 二次元拡散"
            - text: "第10回 二次元移流拡散"
            - text: "第11回 PDE分類、Laplace方程式"
            - text: "第12回 Poisson方程式"
            - text: "第13回 最終プレゼンテーション 1"
            - text: "第14回 最終プレゼンテーション 2・試験案内"
            - text: "第15回 到達度確認試験"
    - id: guides
      title: "ガイド"
      style: docked
      contents:
        - href: guides/index.qmd
          text: "ガイド一覧"
        - href: guides/testing.qmd
          text: "テストと数値検証"
        - href: guides/commands.qmd
          text: "コマンド一覧"
        - href: guides/troubleshooting.qmd
          text: "トラブル対応"
        - href: guides/glossary.qmd
          text: "用語集"
    - id: advanced
      title: "任意の発展資料"
      style: docked
      contents:
        - href: advanced/index.qmd
          text: "発展資料一覧"
        - href: advanced/cairomakie.qmd
          text: "任意: CairoMakieによる可視化"
  page-footer:
    left: "Copyright © 2026 荒木 亮（ARAKI, Ryo）"
    right: "教材・図: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) / コード: [MIT](LICENSE-MIT.txt)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    include-after-body:
      - assets/navigation-loader.html
