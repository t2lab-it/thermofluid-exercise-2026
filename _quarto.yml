project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - setup/*.qmd
    - lessons/*.qmd
    - assignments/*.qmd
    - guides/*.qmd
    - advanced/*.qmd
    - projects/final-project-topics/*.qmd

engines: ['julia']
lang: ja

